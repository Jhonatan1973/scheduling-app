name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build · unit · integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SchedulingApp.slnx

      - name: Build
        run: dotnet build SchedulingApp.slnx -c Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/SchedulingApp.UnitTests -c Release --no-build
          --logger "trx;LogFileName=unit.trx" --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Integration tests (Testcontainers / PostgreSQL)
        run: >
          dotnet test tests/SchedulingApp.IntegrationTests -c Release --no-build
          --logger "trx;LogFileName=integration.trx" --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scheduling_app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_BASE_URL: http://localhost:5126
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build SchedulingApp.slnx -c Release

      - name: Start API
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__Database: Host=localhost;Port=5432;Database=scheduling_app;Username=postgres;Password=postgres
          Jwt__Secret: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          Seed__DemoData: "true"
          Email__Provider: Log
          RateLimiting__AuthPermitPerMinute: "1000"
        run: |
          nohup dotnet run --project src/SchedulingApp.Api -c Release --no-build --no-launch-profile \
            --urls http://localhost:5251 > api.log 2>&1 &

      - name: Start Web
        env:
          # Development so static web assets (blazor.web.js) are served from the build output
          ASPNETCORE_ENVIRONMENT: Development
          Api__BaseUrl: http://localhost:5251/
        run: |
          nohup dotnet run --project src/SchedulingApp.Web -c Release --no-build --no-launch-profile \
            --urls http://localhost:5126 > web.log 2>&1 &

      - name: Wait for services
        run: |
          for url in http://localhost:5251/health http://localhost:5126/health; do
            for i in $(seq 1 60); do
              if curl -fs "$url" > /dev/null; then echo "$url is up"; break; fi
              sleep 2
              if [ "$i" = "60" ]; then echo "$url did not start"; cat api.log web.log; exit 1; fi
            done
          done

      - name: Install Playwright browsers
        run: pwsh tests/SchedulingApp.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E tests
        run: dotnet test tests/SchedulingApp.E2ETests -c Release --no-build --logger "console;verbosity=normal"

      - name: Upload traces and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            tests/SchedulingApp.E2ETests/bin/Release/net10.0/playwright-traces
            api.log
            web.log

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f src/SchedulingApp.Api/Dockerfile -t scheduling-app-api .
      - name: Build Web image
        run: docker build -f src/SchedulingApp.Web/Dockerfile -t scheduling-app-web .
